name: Flask DevOps App CI

on:
  push:

  pull_request:
    branches:
      - main


permissions:
  contents: read
  packages: write

jobs:
  test-and-build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Flask Application
        run: |
          python -c "from app import app; print('Flask application imported successfully')"

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t flask-devops-app:${{ github.sha }} .

      - name: Push Docker Images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/flask-devops-app:${{ github.sha }}

